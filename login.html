<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Hotel Nova</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-body">


<div class="login-page">


    <div class="login-image">

        <div class="login-image-overlay"></div>

        <div class="login-brand">

            <div class="brand-icon">♨</div>

            <h1>HOTEL <span>NOVA</span></h1>

            <p>LUXURY & COMFORT</p>

        </div>


        <div class="login-welcome">

            <div class="section-label">
                <span></span>
                WELCOME BACK
            </div>

            <h2>
                Your Luxury
                <br>
                Stay Awaits
            </h2>

            <p>
                Sign in to manage your reservations,
                bookings and hotel services.
            </p>

        </div>

    </div>


    <div class="login-container">

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>


        <div class="login-box">

            <div class="login-title">

                <div class="mini-logo">
                    ♨
                </div>

                <h2>Welcome Back</h2>

                <p>
                    Sign in to your Hotel Nova account
                </p>

            </div>


            <div class="login-tabs">

                <button
                    class="login-tab active-login-tab"
                    onclick="showLogin('customer')"
                    id="customerTab">
                    Customer
                </button>

                <button
                    class="login-tab"
                    onclick="showLogin('admin')"
                    id="adminTab">
                    Admin
                </button>

            </div>


            <div id="customerLogin">

                <div class="input-group">

                    <label>Phone Number</label>

                    <div class="input-icon">

                        <span>📱</span>

                        <input
                            type="tel"
                            id="loginPhone"
                            placeholder="Enter 10 digit phone number"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="input-icon">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="customerPassword"
                            placeholder="Enter password"
                        >

                    </div>

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <button class="login-button" onclick="customerLogin()">
                    Sign In →
                </button>

            </div>


            <div id="adminLogin" class="hidden-login">

                <div class="input-group">

                    <label>Username</label>

                    <div class="input-icon">

                        <span>♙</span>

                        <input
                            type="text"
                            id="adminUsername"
                            placeholder="Enter username"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <div class="input-icon">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter password"
                        >

                    </div>

                </div>


                <button class="login-button" onclick="adminLogin()">
                    Admin Sign In →
                </button>

            </div>


            <div class="login-divider">
                <span>OR</span>
            </div>


            <a href="booking.html" class="guest-button">
                Continue as Guest
            </a>


            <p class="login-footer">
                © 2026 Hotel Nova
            </p>

        </div>

    </div>

</div>


<script>

function showLogin(type) {

    const customer = document.getElementById("customerLogin");
    const admin = document.getElementById("adminLogin");

    const customerTab = document.getElementById("customerTab");
    const adminTab = document.getElementById("adminTab");

    if (type === "customer") {

        customer.classList.remove("hidden-login");
        admin.classList.add("hidden-login");

        customerTab.classList.add("active-login-tab");
        adminTab.classList.remove("active-login-tab");

    } else {

        admin.classList.remove("hidden-login");
        customer.classList.add("hidden-login");

        adminTab.classList.add("active-login-tab");
        customerTab.classList.remove("active-login-tab");

    }

}


function customerLogin() {

    const phone =
        document.getElementById("loginPhone").value;

    const password =
        document.getElementById("customerPassword").value;

    if (phone.length !== 10) {

        alert("Please enter a valid 10 digit phone number.");
        return;

    }

    if (password === "") {

        alert("Please enter your password.");
        return;

    }

    alert("Customer login successful!");

    window.location.href = "booking.html";

}


function adminLogin() {

    const username =
        document.getElementById("adminUsername").value;

    const password =
        document.getElementById("adminPassword").value;

    if (username === "admin" && password === "1234") {

        alert("Admin login successful!");

        window.location.href = "dashboard.html";

    } else {

        alert("Invalid admin username or password.");

    }

}

</script>

</body>
</html>
